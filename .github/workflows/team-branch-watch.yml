name: TASK D team branch notifications

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '감지 결과만 확인 (Issue 생성/댓글/상태 저장 안 함)'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: task-d-team-branch-watch
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check A/B/C and notify TASK D
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          WATCH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          TASK_D_NOTIFY_USER: ${{ vars.TASK_D_NOTIFY_USER || github.repository_owner }}
        with:
          script: |
            const { run } = require('./.github/scripts/team-branch-watch.cjs');
            await run({ github, context, core });

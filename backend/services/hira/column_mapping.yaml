# 가정: 실제 HIRA 샘플이 없어 흔한 컬럼명으로 구성. 다르면 이 파일의 별칭만 고치면 된다.
# 헤더 비교는 공백 제거 + 소문자 기준.
fields:
  date: [진료일자, 조제일자, 처방일자, 진료일, 조제일, 투약일자]
  institution: [요양기관명, 의료기관명, 병원명, 약국명, 기관명]
  product_name: [약품명, 약품명칭, 처방약품명, 의약품명, 제품명]
  drug_code: [약품코드, 보험코드, 의약품코드, 약품일련번호, 주성분코드]
  ingredient: [성분명, 주성분명, 일반명, 주성분]
  strength: [함량, 규격, 용량]
  dose_per_time: [1회투약량, 1회투여량, 1회용량]
  times_per_day: [1일투여횟수, 1일투약횟수, 일일투여횟수]
  total_days: [총투약일수, 총투여일수, 투약일수, 처방일수]
required_fields: [product_name]
header_scan_rows: 30      # 이 행 수 안에서 헤더 탐지
min_header_matches: 2     # 헤더로 인정할 최소 별칭 일치 수
year_range: [1990, 2100]  # 이 범위 밖 날짜는 이상 날짜로 처리
